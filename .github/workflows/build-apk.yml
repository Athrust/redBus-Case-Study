name: Build Downloadable APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: redbus-app/package-lock.json

      - name: Install dependencies
        run: |
          cd redbus-app
          npm install

      - name: Prebuild Android project
        run: |
          cd redbus-app
          npx expo prebuild --platform android --no-install

      - name: Build Installable Debug APK
        run: |
          cd redbus-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Sharing
        run: |
          mkdir -p build-output
          cp redbus-app/android/app/build/outputs/apk/debug/app-debug.apk build-output/redBus-Vikalp-Pass.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: redBus-Vikalp-Pass
          path: build-output/redBus-Vikalp-Pass.apk
          retention-days: 30

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "redBus Vikalp Pass APK (v1.0.0)"
          body: |
            ### 🚌 redBus Vikalp Pass — Team Vantage (Prodyssey 2026)
            
            Downloadable Android APK for demonstration and evaluation of the **redBus Vikalp Pass** feature.
            
            #### 📱 How to Install:
            1. Download `redBus-Vikalp-Pass.apk` below directly onto your Android phone or tablet.
            2. Tap the downloaded file and select **Install** (allow installation from unknown sources if prompted).
            3. Open **redBus Clone** and explore the Vikalp Pass flow!
          files: build-output/redBus-Vikalp-Pass.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
